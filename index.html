<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库查询</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fef2f2;
            padding: 1.5rem;
        }

        /* 卡片容器 —— 红色警示风格，去掉顶部刘海 */
        .error-container {
            max-width: 640px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            padding: 3.5rem 3rem 3rem;
            box-shadow: 
                0 20px 40px -12px rgba(185, 28, 28, 0.15),
                0 8px 24px -6px rgba(185, 28, 28, 0.08);
            border: 1px solid #fecaca;
            text-align: center;
            transition: box-shadow 0.2s ease;
            /* 移除 ::before 伪元素 */
        }

        /* ===== 大大的 X ===== */
        .error-x {
            font-size: 6rem;
            line-height: 1;
            color: #dc2626;
            font-weight: 700;
            user-select: none;
            margin-bottom: 0.2rem;
            text-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
            display: block;
        }

        /* ===== 巨大的 "404" 数字 ===== */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: #dc2626;
            user-select: none;
            margin-bottom: 0.2rem;
            text-shadow: 0 4px 12px rgba(220, 38, 38, 0.12);
        }

        /* ===== 主标题 ===== */
        .error-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #991b1b;
            margin-top: -0.5rem;
            letter-spacing: -0.02em;
        }

        /* ===== 描述信息 ===== */
        .error-desc {
            font-size: 1rem;
            color: #7f1d1d;
            line-height: 1.7;
            margin: 0.75rem 0 2.2rem;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-desc strong {
            color: #b91c1c;
            font-weight: 700;
            background: #fee2e2;
            padding: 0.1rem 0.6rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        /* ===== 分割线 ===== */
        .divider-line {
            width: 48px;
            height: 3px;
            background: #fca5a5;
            border-radius: 6px;
            margin: 0 auto 1.8rem;
        }

        /* ===== 底部状态标签 ===== */
        .status-meta {
            margin-top: 2.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            font-size: 0.75rem;
            color: #b91c1c;
            letter-spacing: 0.03em;
            background: #fef2f2;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #fecaca;
        }

        .status-meta i {
            font-size: 0.65rem;
            opacity: 0.7;
            color: #dc2626;
        }

        .status-meta .dot {
            width: 4px;
            height: 4px;
            background: #dc2626;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.5;
        }

        /* ===== 响应式适配 ===== */
        @media (max-width: 520px) {
            .error-container {
                padding: 2.5rem 1.5rem 2rem;
                border-radius: 1.5rem;
            }

            .error-x {
                font-size: 4.5rem;
            }

            .error-code {
                font-size: 5.5rem;
            }

            .error-title {
                font-size: 1.8rem;
                margin-top: -0.2rem;
            }

            .error-desc {
                font-size: 0.95rem;
                padding: 0 0.2rem;
            }
        }

        @media (max-width: 380px) {
            .error-x {
                font-size: 3.5rem;
            }
            .error-code {
                font-size: 4rem;
            }
            .error-title {
                font-size: 1.5rem;
            }
        }
    </style>
    <!-- Font Awesome 图标库（用于底部状态图标） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

    <div class="error-container" role="main" aria-labelledby="error-title">

  

        <!-- 经典 404 数字 -->
        <div class="error-code" aria-hidden="true">404</div>

        <!-- 主标题 -->
        <h1 id="error-title" class="error-title">未找到该用户</h1>

        <!-- 描述 -->
        <p class="error-desc">
            当前数据库中<strong>查无此人</strong>，该用户记录不存在。<br />
            请核对查询条件或联系负责人
        </p>

        <!-- 装饰分割线 -->
        <div class="divider-line" aria-hidden="true"></div>

        <!-- 底部状态 -->
        <div class="status-meta">
            <i class="fas fa-database" aria-hidden="true"></i>
            <span>数据库状态</span>
            <span class="dot"></span>
            <span>用户记录不存在</span>
            <span class="dot"></span>
            <span>错误码·0x0004</span>
        </div>

    </div>

</body>
</html>
